name: Publish judge demo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/judge-demo.yml'
      - 'demo/**'
      - 'static/ui/**'
      - 'src/core/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: judge-demo-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:demo
      - run: mv dist/judge-demo/local-demo.html dist/judge-demo/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/judge-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
