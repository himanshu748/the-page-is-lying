app:
  id: ari:cloud:ecosystem::app/49ffa6f4-93eb-41fb-8f2a-6a087aac4ac0
  runtime:
    name: nodejs24.x
    memoryMB: 512
    architecture: arm64

permissions:
  scopes:
    - storage:app
    - read:page:confluence
    - read:confluence-user
  external:
    fetch:
      backend:
        - address: api.github.com
        - address: codeload.github.com
        - address: api.bitbucket.org
        - address: bitbucket.org

modules:
  macro:
    - key: runbook-check
      title: Runbook check
      description: Checks claims in this section against code and cites file and line.
      category: structure
      layout: bodied
      resource: ui
      resolver:
        function: ui-resolver
      config:
        resource: ui
        viewportSize: medium
        parameters:
          - identifier: repoUrl
            type: string
          - identifier: ref
            type: string

  confluence:contentBylineItem:
    - key: runbook-byline
      title: Runbook check
      tooltip: Check this page's claims against code
      resource: ui
      resolver:
        function: ui-resolver
      viewportSize: large
      dynamicProperties:
        function: byline-props

  confluence:globalSettings:
    - key: runbook-settings
      title: The Page Is Lying
      resource: ui
      resolver:
        function: ui-resolver
      useAsConfig: true

  confluence:spacePage:
    - key: runbook-drift
      title: Doc drift
      route: doc-drift
      resource: ui
      resolver:
        function: ui-resolver

  rovo:agent:
    - key: runbook-checker
      name: Runbook checker
      description: Answers "is this page still true?" from read-only code checks,
        citing file and line.
      prompt: resource:agent-prompts;runbook-checker.md
      conversationStarters:
        - Is this page still true?
        - Can I still call POST /v1/charge?
        - Which claims on this page are contradicted by code?
        - Audit this space and rank the pages that drifted most
      actions:
        - check-page
        - check-claim
        - explain-claim
        - suggest-fix
        - audit-space

  action:
    - key: check-page
      name: Check page against code
      function: check-page-fn
      actionVerb: GET
      description: >
        Read-only. Extracts claims (endpoints, env vars, CLI commands, config keys, paths, package versions)
        from a Confluence page and checks each against the code repository. Returns verdicts with evidence
        IDs, file and line. Never writes.
      inputs:
        page:
          title: Page ID or URL
          type: string
          required: false
          description: Confluence page ID or URL. Leave empty to use the page the user is
            viewing.
    - key: check-claim
      name: Check one claim against code
      function: check-claim-fn
      actionVerb: GET
      description: >
        Read-only. Checks a single claim such as "POST /v1/charge", "STRIPE_KEY"
        or "payments refund --force" against the configured repository and
        returns a verdict with evidence IDs, file and line. Never writes
        anything.
      inputs:
        claim:
          title: Claim
          type: string
          required: true
          description: One endpoint, env var, CLI command or flag, config key, file path
            or package version.
        page:
          title: Page ID or URL
          type: string
          required: false
          description: Optional page whose repository setting should be used.
    - key: explain-claim
      name: Explain a claim's verdict
      function: explain-claim-fn
      actionVerb: GET
      description: >
        Read-only. Explains a check-claim verdict: how the text was parsed, which rule decided, which part
        of the code index was searched and how complete it is. Same evidence IDs. Never writes.
      inputs:
        claim:
          title: Claim
          type: string
          required: true
          description: One endpoint, env var, CLI command or flag, config key, file path
            or package version.
        page:
          title: Page ID or URL
          type: string
          required: false
          description: Optional page whose repository setting should be used.
    - key: suggest-fix
      name: Suggest an edit for contradicted claims
      function: suggest-fix-fn
      actionVerb: GET
      description: >
        Read-only. Proposes the edit for contradicted claims from the code (nearest route, variable, flag,
        key, path or version) with its evidence ID. Pass a claim, or only a page for all of its
        contradictions. Never edits a page.
      inputs:
        claim:
          title: Claim
          type: string
          required: false
          description: One claim to get an edit for. Leave empty to cover the whole page.
        page:
          title: Page ID or URL
          type: string
          required: false
          description: Confluence page ID or URL. Leave empty to use the page the user is
            viewing.
    - key: audit-space
      name: Audit a space for doc drift
      function: audit-space-fn
      actionVerb: GET
      description: >
        Read-only. Checks the 25 most recently edited pages of the space that contains the given page and
        ranks them by contradicted claims, with top contradictions, evidence IDs and proposed edits.
        Never writes.
      inputs:
        page:
          title: Page ID or URL
          type: string
          required: false
          description: Any page in the space to audit. Leave empty to use the page the user
            is viewing.

  rovo:mcp:
    - key: runbook-checker-mcp
      name: Runbook checker
      tools:
        - check-page
        - check-claim
        - explain-claim
        - suggest-fix
        - audit-space

  rovo:skill:
    - key: runbook-checker-skill
      source:
        dir: skills/runbook-checker
      dependencies:
        tools:
          - check-page
          - check-claim
          - explain-claim
          - suggest-fix
          - audit-space

  consumer:
    - key: repo-index-consumer
      queue: repo-index
      function: index-repo-fn

  function:
    - key: ui-resolver
      handler: resolvers/ui.handler
    - key: byline-props
      handler: resolvers/byline.dynamicProperties
    - key: check-page-fn
      handler: actions/checkPage.handler
    - key: check-claim-fn
      handler: actions/checkClaim.handler
    - key: explain-claim-fn
      handler: actions/explainClaim.handler
    - key: suggest-fix-fn
      handler: actions/suggestFix.handler
    - key: audit-space-fn
      handler: actions/auditSpace.handler
      timeoutSeconds: 55
    - key: index-repo-fn
      handler: consumers/indexRepo.handler
      timeoutSeconds: 300

resources:
  - key: ui
    path: static/ui/dist
  - key: agent-prompts
    path: prompts
